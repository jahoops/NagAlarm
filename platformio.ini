[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:esp32dev-bench]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<main.cpp>
  +<main_esp32_bench.cpp>
  -<main_esp32_now_comm.cpp>

[env:esp32dev-now-sender]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<main.cpp>
  +<main_esp32_now_comm.cpp>
  -<main_esp32_bench.cpp>
build_flags =
  -D NOW_ROLE=1

[env:esp32dev-now-receiver]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<main.cpp>
  +<main_esp32_now_comm.cpp>
  -<main_esp32_bench.cpp>
build_flags =
  -D NOW_ROLE=2
